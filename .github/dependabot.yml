version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'

  - package-ecosystem: 'gradle'
    directories:
      - '/android/'
      - '/example/android/'
    schedule:
      interval: 'daily'
    labels:
      - 'nitro-core'
      - 'nitrogen'
      - 'dependencies'
      - 'kotlin'
    ignore:
      # The example app's wrapper follows the React Native template. Newer
      # Gradle releases ship Kotlin metadata the RN Gradle plugin can't read.
      - dependency-name: 'gradle-wrapper'

  - package-ecosystem: 'bundler'
    directory: '/example/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'ruby'
    # Keep the CocoaPods-related pins from the React Native template Gemfile;
    # only refresh Gemfile.lock within them.
    versioning-strategy: lockfile-only

  - package-ecosystem: 'npm'
    directories:
      - '/example/'
      - '/'
    schedule:
      interval: 'daily'
    labels:
      - 'nitro-core'
      - 'dependencies'
      - 'typescript'
      - 'nitrogen'
    ignore:
      # React Native and Worklets still require Babel 7.
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      # React Native upgrades touch native templates and must move core and
      # tooling together, so they are done by hand. Patch releases still come.
      - dependency-name: 'react-native'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # Each CLI major targets specific React Native versions (20.x covers
      # 0.81-0.88), so the CLI major moves with React Native upgrades.
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-major']
      # React Native ships a renderer built for one exact React release, so
      # React and its types/test renderer move with React Native upgrades.
      - dependency-name: 'react'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-test-renderer'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # @react-native/eslint-config 0.86 supports ESLint 8 and 9 only, and this
      # repo uses the eslintrc format (eslintConfig in package.json), which
      # ESLint 10 removes. Move ESLint majors with a flat-config migration.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # The package declares peer support for Reanimated 4.6.x and Worklets
      # 0.12.x. Widening that is a deliberate compatibility change, so only
      # patch releases come through here.
      - dependency-name: 'react-native-reanimated'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-worklets'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']

    groups:
      react-native-cli:
        patterns:
          - '@react-native-community/cli*'
      babel:
        patterns:
          - '@babel/*'
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
      nitro:
        patterns:
          - 'nitrogen'
          - 'react-native-nitro-modules'
      reanimated:
        patterns:
          - 'react-native-reanimated'
          - 'react-native-worklets'
